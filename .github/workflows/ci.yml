name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  test:
    name: Test & Lint (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify dependency consistency and dry-run packaging
        run: |
          python -m pip check
          python -m pip install --no-build-isolation --dry-run .

      - name: Verify PEP 639 build metadata (wheel & sdist)
        run: |
          python -m build --sdist --wheel --outdir .pytest_temp/dist
          python -c "import glob, tarfile, zipfile; w = glob.glob('.pytest_temp/dist/*.whl')[0]; n = zipfile.ZipFile(w).namelist(); assert any(x.endswith('LICENSE') for x in n) and any(x.endswith('THIRD_PARTY_LICENSES.md') for x in n) and any(x.endswith('py.typed') for x in n); s = glob.glob('.pytest_temp/dist/*.tar.gz')[0]; m = tarfile.open(s, 'r:gz').getnames(); assert any(x.endswith('/ellmos-module.v2.json') for x in m) and any(x.endswith('/SECURITY.md') for x in m)"

      - name: Check patch hygiene and Ruff lint/format
        run: |
          git diff --check
          python -m ruff check .
          python -m ruff format --check .

      - name: Bytecode compile check
        run: python -m compileall -q src tests

      - name: Run pytest suite
        run: python -m pytest -v
