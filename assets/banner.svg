<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <style>
      .font-sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      }
      .font-mono {
        font-family: 'Cascadia Code', Consolas, Monaco, monospace;
      }
    </style>

    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>

    <!-- Ambient Glow Radials -->
    <radialGradient id="glow-p" cx="170" cy="140" r="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#65a30d" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-s" cx="550" cy="160" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter for Glassmorphic Elements -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base Layer -->
  <rect width="1200" height="300" fill="url(#bg-grad)" />

  <!-- Technical Coordinate Grid Overlay -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200" />
    <path d="M100 0 V300 M200 0 V300 M300 0 V300 M400 0 V300 M500 0 V300 M600 0 V300 M700 0 V300 M800 0 V300 M900 0 V300 M1000 0 V300 M1100 0 V300" />
  </g>

  <!-- Ambient Glow Orbs -->
  <circle cx="170" cy="140" r="200" fill="url(#glow-p)" />
  <circle cx="550" cy="160" r="220" fill="url(#glow-s)" />

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="5" height="300" fill="#84cc16" />

  <!-- Left Domain Graphic Motif (x=40..310, y=30..270) -->
  
    <!-- Ellmos Sensation: Permission-Gated Sensing & Zero-Egress Presence -->
    <g transform="translate(45, 35)">
      <!-- Outer Sensor Field Orbit -->
      <circle cx="130" cy="110" r="88" fill="none" stroke="#84cc16" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>

      <!-- Optical Camera Iris / Aperture Ring -->
      <g transform="translate(75, 55)">
        <circle cx="55" cy="55" r="50" fill="#0f172a" stroke="#84cc16" stroke-width="2" filter="url(#drop-shadow)"/>
        <path d="M 55 15 L 85 45 L 65 75 L 25 75 L 25 35 Z" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.8"/>
        <circle cx="55" cy="55" r="22" fill="#022c22" stroke="#84cc16" stroke-width="1.8"/>
        <circle cx="55" cy="55" r="10" fill="#84cc16" fill-opacity="0.4"/>
        <circle cx="60" cy="50" r="3" fill="#f8fafc"/>
      </g>

      <!-- Permission Padlock Overlay -->
      <g transform="translate(170, 42)">
        <rect width="45" height="50" rx="6" fill="#0b0f19" stroke="#84cc16" stroke-width="1.5" filter="url(#drop-shadow)"/>
        <path d="M 16 22 V 14 a 7 7 0 0 1 14 0 v 8" fill="none" stroke="#84cc16" stroke-width="2" stroke-linecap="round"/>
        <circle cx="23" cy="32" r="3" fill="#84cc16"/>
        <line x1="23" y1="35" x2="23" y2="40" stroke="#84cc16" stroke-width="1.5"/>
      </g>

      <!-- Acoustic Ambient dB Waves -->
      <path d="M 45 100 A 20 20 0 0 0 45 120" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
      <path d="M 38 93 A 30 30 0 0 0 38 127" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>

      <!-- Zero-Egress Status Badge -->
      <g transform="translate(45, 180)">
        <rect width="170" height="22" rx="4" fill="#0f172a" stroke="#84cc16" stroke-width="1.2"/>
        <circle cx="14" cy="11" r="3" fill="#22c55e"/>
        <text x="24" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#84cc16">ZERO-EGRESS // RAM ONLY</text>
      </g>
    </g>
    

  <!-- Vertical Divider Line -->
  <line x1="330" y1="35" x2="330" y2="265" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Right Branding & Meta Information (x=360..1160) -->
  <g transform="translate(360, 0)">
    <!-- Top Category Badge -->
    <g transform="translate(0, 48)">
      <rect width="308.8" height="24" rx="5" fill="#84cc16" fill-opacity="0.14" stroke="#84cc16" stroke-width="1"/>
      <text x="12" y="16" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.2" fill="#84cc16">ELLMOS-AI // PERCEPTION // SENSOR GATES</text>
    </g>

    <!-- Repository Title -->
    <text x="0" y="122" class="font-sans" font-size="44" font-weight="800" letter-spacing="-1" fill="url(#title-grad)">ellmos-sensation</text>

    <!-- English Subtitle / Tagline -->
    <text x="0" y="158" class="font-sans" font-size="17" font-weight="500" fill="#94a3b8">Permission-Gated Sensing &amp; Zero-Egress Presence Detection</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 214)">
      
        <g transform="translate(0, 0)">
          <rect width="197" height="30" rx="15" fill="#0f172a" stroke="#84cc16" stroke-width="1.2"/>
          <text x="98.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">👁️ RAM-Only Presence</text>
        </g>
        

        <g transform="translate(209, 0)">
          <rect width="136" height="30" rx="15" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2"/>
          <text x="68.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🔒 Zero-Egress</text>
        </g>
        

        <g transform="translate(357, 0)">
          <rect width="197" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
          <text x="98.5" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🛡️ Fail-Closed Gates</text>
        </g>
        

        <g transform="translate(566, 0)">
          <rect width="182" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
          <text x="91.0" y="19" class="font-sans" font-size="12" font-weight="600" fill="#f1f5f9" text-anchor="middle">🎙️ Ambient Sensing</text>
        </g>
        
    </g>
  </g>
</svg>